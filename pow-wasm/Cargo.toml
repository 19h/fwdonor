[package]
name = "fwdonor-pow"
version = "0.1.0"
edition = "2021"
description = "Proof-of-work search for the fwdonor page (WASM, SIMD)"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Not part of the server's package.
[workspace]
